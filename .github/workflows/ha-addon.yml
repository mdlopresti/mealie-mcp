name: Home Assistant App

# Home Assistant offers an update whenever mealie_mcp/config.yaml `version`
# changes and pulls ghcr.io/<owner>/mealie-mcp-addon:<version>. Images are
# therefore built ONLY from release tags (vX.Y.Z), never from plain commits.
# Cut a release with: python scripts/release.py bump patch|minor|major

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mealie-mcp-addon

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Check CHANGELOG, config.yaml and __version__ agree
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/release.py check --tag "$GITHUB_REF_NAME"
          else
            python scripts/release.py check
          fi

      - name: Read version
        id: version
        run: echo "version=$(python scripts/release.py version)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push app image
    needs: version-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute semver tags
        id: tags
        run: |
          V="${{ needs.version-check.outputs.version }}"
          TAGS="${IMAGE}:${V}"
          # Stable releases also move X.Y and latest; pre-releases (X.Y.Z-rc.1) do not.
          if [[ "$V" != *-* ]]; then
            TAGS="${TAGS},${IMAGE}:${V%.*},${IMAGE}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

      - name: Refuse to overwrite an existing release image
        run: |
          if docker manifest inspect "${IMAGE}:${{ needs.version-check.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ needs.version-check.outputs.version }} already exists. Bump the version with scripts/release.py."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + aarch64)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: mealie_mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.version-check.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.version-check.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.version=${{ needs.version-check.outputs.version }}
          cache-from: type=gha,scope=ha-addon
          cache-to: type=gha,mode=max,scope=ha-addon
