configuration:
  mealie_url:
    name: Mealie URL
    description: Base URL of your Mealie instance, e.g. http://192.168.1.50:9925 (no trailing slash).
  mealie_api_token:
    name: Mealie API token
    description: Create one in Mealie under User Profile > API Tokens.
  mcp_auth_token:
    name: MCP bearer token
    description: Optional but recommended. Clients must send "Authorization Bearer <token>" to use the server.
  log_level:
    name: Log level
    description: Web server log verbosity.
network:
  8099/tcp: MCP streamable HTTP endpoint (/mcp)
