configuration:
  mealie_url:
    name: Mealie URL
    description: How this app reaches Mealie, no trailing slash. Mealie app on this Home Assistant -> internal hostname and container port, e.g. http://db21ed7f-mealie:9001. Elsewhere -> e.g. http://192.168.1.50:9925. Not localhost, mealie.local or an Ingress URL.
  mealie_api_token:
    name: Mealie API token
    description: Create one in Mealie under User Profile > API Tokens.
  mcp_auth_token:
    name: MCP bearer token
    description: Strongly recommended. Clients must send the header "Authorization Bearer <token>". Use letters and digits only (32+ characters).
  log_level:
    name: Log level
    description: Web server log verbosity.
network:
  8099/tcp: MCP streamable HTTP endpoint (/mcp)
